name: "Update Good First Issues"

on:
  schedule:
    - cron: '15 20 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-issues:
    if: "!contains(github.event.head_commit.message, 'chore: update good first issues')"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Generate good first issues CSV
        uses: ./
        with:
          usernames: ${{ secrets.USERNAMES }}
          github-token: ${{ secrets.ACCESS_TOKEN }}
          output-path: good_first_issues.csv

      - name: Render README
        run: |
          python -m app.render_readme \
            --input good_first_issues.csv

      - name: Upload CSV artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: good-first-issues
          path: good_first_issues.csv

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md good_first_issues.csv

          git diff --staged --quiet || git commit -m "chore: update good first issues [skip ci]"

          git pull --rebase origin main
          git push origin main
