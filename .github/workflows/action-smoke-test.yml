name: Action Smoke Test

on:
  pull_request:
    paths:
      - "action.yml"
      - "app/**"
      - "requirements.txt"
  push:
    branches:
      - main
    paths:
      - "action.yml"
      - "app/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against a known target
        uses: ./
        with:
          usernames: drkrillo
          output-format: csv
          output-path: smoke-test-output.csv
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the action produced real output
        run: |
          if [ ! -f smoke-test-output.csv ]; then
            echo "::error::smoke-test-output.csv was not created"
            exit 1
          fi

          lines=$(wc -l < smoke-test-output.csv)
          if [ "$lines" -le 1 ]; then
            echo "::error::smoke-test-output.csv has no data rows (only the header, or is empty) - the action ran but returned nothing. This could mean the action is broken, or that drkrillo/good-first-issues genuinely has zero open 'good first issue' issues right now, in which case pick a different target in this workflow."
            exit 1
          fi

          echo "OK: $lines lines including header"
