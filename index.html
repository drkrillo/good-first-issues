<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Good First Issues</title>

    <!-- PapaParse library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        /* ── colour tokens ── */
        :root {
            --bg:           #ffffff;
            --text:         #1a1a1a;
            --border:       #d0d0d0;
            --th-bg:        #e8eaf0;
            --th-text:      #1a1a1a;
            --row-alt:      #f5f7fa;
            --row-hover:    #e8f0fe;
            --link:         #1a73e8;
            --btn-bg:       #1a73e8;
            --btn-hover:    #1558b0;
            --btn-text:     #ffffff;
            --input-bg:     #ffffff;
            --input-border: #c0c0c0;
            --focus-ring:   #1a73e8;
            --focus-glow:   rgba(26, 115, 232, 0.25);
            --shadow:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg:           #0f0f0f;
                --text:         #e8e8e8;
                --border:       #2e2e2e;
                --th-bg:        #252535;
                --th-text:      #dde4ff;
                --row-alt:      #181828;
                --row-hover:    #252545;
                --link:         #8ab4f8;
                --btn-bg:       #4a6cf7;
                --btn-hover:    #6b87ff;
                --btn-text:     #ffffff;
                --input-bg:     #1e1e1e;
                --input-border: #3e3e3e;
                --focus-ring:   #8ab4f8;
                --focus-glow:   rgba(138, 180, 248, 0.25);
                --shadow:       0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 32px 16px;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 28px;
        }

        /* ── controls toolbar ── */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }

        #searchBox,
        #languageFilter {
            padding: 9px 13px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 7px;
            background-color: var(--input-bg);
            color: var(--text);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        #searchBox:focus-visible,
        #languageFilter:focus-visible {
            outline: none;
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 3px var(--focus-glow);
        }

        #searchBox {
            flex: 1 1 200px;
            min-width: 160px;
        }

        #languageFilter {
            flex: 0 1 180px;
        }

        /* ── table ── */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 11px 16px;
            font-size: 14px;
            text-align: left;
        }

        th.align-center,
        td.align-center {
            text-align: center;
        }

        /* Remove double-border where cells meet the wrapper edge */
        tr:first-child th,
        tr:first-child td { border-top: none; }
        tr:last-child td  { border-bottom: none; }
        th:first-child,
        td:first-child    { border-left: none; }
        th:last-child,
        td:last-child     { border-right: none; }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: var(--th-bg);
            color: var(--th-text);
            font-weight: 600;
            white-space: nowrap;
        }

        th .sort-btn {
            all: unset;
            cursor: pointer;
            font: inherit;
            color: inherit;
            font-weight: 600;
            white-space: nowrap;
        }

        th .sort-btn:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
            border-radius: 3px;
        }

        th .sort-btn:hover {
            text-decoration: underline;
        }

        tr:nth-child(even) td {
            background-color: var(--row-alt);
        }

        td {
            transition: background-color 0.12s ease;
        }

        tr:hover td {
            background-color: var(--row-hover);
        }

        a {
            color: var(--link);
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Good First Issues</h1>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search issues...">

        <select id="languageFilter" aria-label="Filter by language">
            <option value="">All languages</option>
        </select>

    </div>

    <div class="table-wrapper">
        <table id="issuesTable"></table>
    </div>

</div>

<script>
    let issuesData = []
    let currentSearch = "";
    let currentLanguage = "";
    let sortColumn = null;
    let sortDir = "desc";

    const COLUMNS = [
        { key: "repo",       label: "Repo" },
        { key: "language",   label: "Language" },
        { key: "title",      label: "Title", truncate: 90 },
        { key: "url",        label: "URL",      render: "link", linkText: "Open Issue" },
        { key: "comments",   label: "Comments", sortable: true, numeric: true, align: "center" },
        { key: "labels",     label: "Labels" },
        { key: "created_at", label: "Created",  sortable: true },
        { key: "updated_at", label: "Updated",  sortable: true },
    ];

    const $ = (id) => document.getElementById(id);
    const searchBox = $("searchBox");
    const languageFilter = $("languageFilter");
    const table = $("issuesTable");

    function handleSort(column) {
        if (sortColumn === column) {
            sortDir = sortDir === "desc" ? "asc" : "desc";
        } else {
            sortColumn = column;
            sortDir = "desc";
        }
        updateTable();
    }

    function renderTable(data) {

        table.innerHTML = "";

        const header = data[0];
        const rows = data.slice(1);

        const idx = {};
        header.forEach((name, i) => { idx[name] = i; });

        const visible = COLUMNS.filter(c => !c.hidden);

        const headTr = document.createElement("tr");
        visible.forEach(col => {
            const th = document.createElement("th");
            if (col.align) {
                th.classList.add(`align-${col.align}`);
            }

            if (col.sortable) {
                const btn = document.createElement("button");
                btn.className = "sort-btn";
                btn.type = "button";

                const indicator = sortColumn === col.key
                    ? (sortDir === "asc" ? " \u25B2" : " \u25BC")
                    : "";
                btn.textContent = col.label + indicator;

                btn.addEventListener("click", () => handleSort(col.key));
                th.appendChild(btn);

                if (sortColumn === col.key) {
                    th.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : "descending");
                } else {
                    th.setAttribute("aria-sort", "none");
                }
            } else {
                th.textContent = col.label;
            }
            headTr.appendChild(th);
        });
        table.appendChild(headTr);

        rows.forEach(row => {
            const tr = document.createElement("tr");

            visible.forEach(col => {
                const td = document.createElement("td");
                if (col.align) {
                    td.classList.add(`align-${col.align}`);
                }
                const value = row[idx[col.key]];

                if (col.render === "link") {
                    const a = document.createElement("a");
                    a.href = col.href ? row[idx[col.href]] : value;
                    a.innerText = col.linkText || value;
                    a.target = "_blank";
                    td.appendChild(a);
                } else if (col.truncate && value.length > col.truncate) {
                    td.innerText = value.slice(0, col.truncate).trimEnd() + "…";
                    td.title = value;
                } else {
                    td.innerText = value;
                }
                tr.appendChild(td);
            });

            table.appendChild(tr);
        });

    }

    function getColumnIndex(header, columnName) {
        return header.indexOf(columnName);
    }

    function updateTable() {

        const header = issuesData[0];
        let rows = issuesData.slice(1);

        const languageIdx = getColumnIndex(header, "language");

        if (currentSearch !== "") {
            rows = rows.filter(row => {
                return row.join(" ").toLowerCase().includes(currentSearch.toLowerCase())
            });
        }

        if (currentLanguage !== "") {
            rows = rows.filter(row => {
                return row[languageIdx] === currentLanguage
            });
        }

        if (sortColumn) {
            const sortIdx = getColumnIndex(header, sortColumn);
            const col = COLUMNS.find(c => c.key === sortColumn);
            const isNumeric = col && col.numeric;
            rows.sort((a, b) => {
                const av = a[sortIdx];
                const bv = b[sortIdx];
                const cmp = isNumeric ? Number(av) - Number(bv) : av.localeCompare(bv);
                return sortDir === "asc" ? cmp : -cmp;
            });
        }

        renderTable([header, ...rows]);
    }

    searchBox.addEventListener("input", () => {
        currentSearch = searchBox.value;

         updateTable();
    });

    languageFilter.addEventListener("change", () => {
        currentLanguage = languageFilter.value;

        updateTable();
    })

    fetch("good_first_issues.csv")
        .then(response => response.text())
        .then(csvText => {

            Papa.parse(csvText, {
                skipEmptyLines: true,
                complete: function(results) {
                    issuesData = results.data;

                    const header = issuesData[0];
                    const languageIdx = getColumnIndex(header, "language");

                    const languages = [
                        ...new Set(
                            issuesData.slice(1).map(row => row[languageIdx])
                        )
                    ];

                    languages.forEach(lang => {
                        const option = document.createElement("option");

                        option.value = lang;
                        option.textContent = lang;

                        languageFilter.appendChild(option);
                    });

                    renderTable(issuesData)
                }
            });
        })
        .catch(err => {
            console.error("Error loading CSV:", err);
        });
</script>

</body>
</html>
